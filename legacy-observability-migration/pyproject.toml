[project]
name = "legacy-observability-migration"
version = "0.1.0"
description = "AI-assisted discovery and non-invasive instrumentation for migrating legacy systems to modern observability"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.34",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
legacy-scan = "legacy_observability_migration.cli:scan_command"
legacy-infer-schema = "legacy_observability_migration.cli:infer_schema_command"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
